name: CI

on:
  pull_request:
  push:
    branches: [main, feature/multi-business-saas]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Solo para que Prisma genere el cliente; ningún paso se conecta a la base
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Misma versión que en desarrollo: npm 11 genera el package-lock.json
          # y npm 10 (Node 22) lo considera desincronizado al hacer npm ci
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
