<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#0f2733" />
        <title>Sin conexión</title>
        <style>
            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
                box-sizing: border-box;
                text-align: center;
                background: #f1f3f2;
                color: #0f2733;
                font-family: system-ui, sans-serif;
            }
            h1 {
                margin: 0;
                font-size: 1.875rem;
                font-weight: 600;
            }
            p {
                margin: 12px 0 0;
                max-width: 36ch;
                color: #4a5a61;
                line-height: 1.5;
            }
            button {
                margin-top: 24px;
                min-height: 48px;
                padding: 0 24px;
                border: 0;
                background: #0f2733;
                color: #fff;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>Sin conexión</h1>
        <p>Revisa tu internet e inténtalo de nuevo. Tus citas siguen guardadas.</p>
        <p>You are offline. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Volver a intentar</button>
    </body>
</html>
